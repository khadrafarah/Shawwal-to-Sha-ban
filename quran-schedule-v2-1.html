<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Qur'an Schedule</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap');

  :root{
    --bg: #0e1410;
    --bg-card: #161f19;
    --bg-card-hover: #19241d;
    --line: #263129;
    --gold: #c9a86a;
    --teal: #5fa893;
    --teal-dim: #25382f;
    --mon: #b07a6b;
    --mon-dim: #34241f;
    --ink: #e9e6db;
    --ink-dim: #93a09a;
    --ink-faint: #57645c;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:
      radial-gradient(ellipse 1000px 500px at 50% 0%, rgba(95,168,147,0.06), transparent),
      var(--bg);
    color:var(--ink);
    font-family:'Jost', sans-serif;
    min-height:100vh;
    padding:40px 20px 60px;
  }

  .wrap{ max-width:680px; margin:0 auto; }

  /* ---------- Week nav ---------- */
  .weeknav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    margin-bottom:8px;
  }
  .navbtn{
    width:34px; height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--bg-card);
    color:var(--ink-dim);
    font-size:15px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:.2s;
    flex-shrink:0;
  }
  .navbtn:hover{ border-color:var(--teal); color:var(--teal); }

  .weekinfo{ text-align:center; min-width:200px; }
  .weekinfo .num{
    font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-faint);
  }
  .weekinfo .dates{
    font-family:'Cormorant Garamond', serif;
    font-size:21px; color:var(--ink); margin-top:4px; font-weight:600;
  }

  .weeknav-row{
    display:flex; flex-direction:column; align-items:center; margin-bottom:36px;
  }
  .todaybtn{
    margin-top:10px;
    font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--teal); background:none; border:1px solid var(--teal-dim);
    border-radius:20px; padding:5px 14px; cursor:pointer; transition:.2s;
  }
  .todaybtn:hover{ background:var(--teal-dim); }

  /* ---------- Day cards ---------- */
  .days{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .day{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 22px;
    display:flex;
    align-items:center;
    gap:18px;
    transition:border-color .2s;
  }
  .day.today{ border-color:var(--gold); }

  .accent{
    width:4px;
    align-self:stretch;
    border-radius:4px;
    flex-shrink:0;
  }
  .day.tue .accent{ background:var(--teal); }
  .day.sat .accent{ background:var(--gold); }
  .day.mon .accent{ background:var(--mon); }

  .daybody{ flex:1; min-width:0; }

  .toprow{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:10px;
  }
  .dayname{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:22px;
    color:var(--ink);
  }
  .daydate{
    font-size:11.5px;
    color:var(--ink-faint);
    white-space:nowrap;
  }
  .todaytag{
    font-size:9px; letter-spacing:.15em; color:var(--gold); font-weight:600; margin-left:8px;
    border:1px solid var(--gold); border-radius:10px; padding:1px 7px;
  }

  .session{
    font-size:14.5px;
    color:var(--ink-dim);
    font-weight:400;
    margin-bottom:4px;
  }
  .pageline{
    font-family:'Cormorant Garamond', serif;
    font-size:19px;
    color:var(--gold);
    font-weight:600;
  }
  .day.tue .pageline{ color:var(--teal); }
  .day.mon .pageline{ color:var(--mon); }

  .check{
    width:28px; height:28px;
    border-radius:50%;
    border:1.5px solid var(--line);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:.2s;
    flex-shrink:0;
  }
  .check svg{ width:13px; height:13px; opacity:0; transition:.2s; }
  .check.done{ background:var(--teal); border-color:var(--teal); }
  .check.done svg{ opacity:1; }
  .check:hover{ border-color:var(--teal); }

  /* ---------- Progress ---------- */
  .progress-wrap{
    margin-top:30px;
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 22px;
  }
  .progress-top{
    display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;
  }
  .progress-top .ttl{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); }
  .progress-top .val{ font-family:'Cormorant Garamond',serif; font-size:18px; color:var(--gold); font-weight:600; }
  .bar{
    height:5px; border-radius:6px; background:var(--bg); overflow:hidden; border:1px solid var(--line);
  }
  .bar-fill{
    height:100%;
    background:var(--teal);
    border-radius:6px;
    transition:width .4s;
  }

  @media (max-width:480px){
    .day{ padding:16px 16px; gap:14px; }
    .dayname{ font-size:19px; }
    .pageline{ font-size:17px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="weeknav-row">
    <div class="weeknav">
      <button class="navbtn" id="prevWeek">‹</button>
      <div class="weekinfo">
        <div class="num" id="weekNum">Week 1</div>
        <div class="dates" id="weekLabel">—</div>
      </div>
      <button class="navbtn" id="nextWeek">›</button>
    </div>
    <button class="todaybtn" id="todayBtn">This week</button>
  </div>

  <div class="days" id="daysList"></div>

  <div class="progress-wrap">
    <div class="progress-top">
      <div class="ttl">Progress</div>
      <div class="val" id="progressVal">Page 0 of 604</div>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
  </div>

</div>

<script>
(function(){
  const PAGES_PER_WEEK = 2;
  const TOTAL_PAGES = 604;
  const ANCHOR_TUESDAY = new Date(2026, 5, 23); // start date — Tuesday, June 23, 2026 — page 1

  function tuesdayOf(d){
    const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const day = dt.getDay(); // 0 Sun..6 Sat, Tue=2
    const diff = (day - 2 + 7) % 7;
    dt.setDate(dt.getDate() - diff);
    return dt;
  }
  const BASE_TUESDAY = tuesdayOf(ANCHOR_TUESDAY);

  function currentWeekOffset(){
    const today = new Date();
    const diffDays = Math.round((tuesdayOf(today) - BASE_TUESDAY) / 86400000);
    return Math.max(0, Math.round(diffDays/7));
  }

  let weekOffset = currentWeekOffset();
  let completed = {};
  let loaded = false;

  const STORAGE_KEY = 'quran-schedule-completed';

  async function loadProgress(){
    try{
      const result = await window.storage.get(STORAGE_KEY, false);
      if(result && result.value){
        completed = JSON.parse(result.value);
      }
    }catch(e){
      completed = {};
    }
    loaded = true;
    render();
  }

  async function saveProgress(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(completed), false);
    }catch(e){
      console.error('Could not save progress', e);
    }
  }

  const dayList = document.getElementById('daysList');
  const weekLabel = document.getElementById('weekLabel');
  const weekNumEl = document.getElementById('weekNum');
  const progressVal = document.getElementById('progressVal');
  const barFill = document.getElementById('barFill');

  function fmt(d){
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
  }
  function addDays(d, n){
    const r = new Date(d);
    r.setDate(r.getDate()+n);
    return r;
  }
  function sameDate(a,b){
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }
  function pagesForWeek(offset){
    let startPage = offset*PAGES_PER_WEEK + 1;
    if(startPage > TOTAL_PAGES) return null;
    let endPage = Math.min(startPage + PAGES_PER_WEEK - 1, TOTAL_PAGES);
    return {startPage, endPage};
  }
  function pageText(p){
    if(!p) return 'Khatm complete';
    return p.startPage === p.endPage ? `Page ${p.startPage}` : `Pages ${p.startPage}–${p.endPage}`;
  }

  function render(){
    if(!loaded){
      dayList.innerHTML = `<div style="text-align:center; color:var(--ink-faint); padding:30px 0; font-size:13px;">Loading…</div>`;
      return;
    }
    // Week "begins" on Tuesday. Tuesday + Saturday (4 days later) belong to this week's pages.
    // Monday (3 days after Saturday / 6 days after Tuesday, i.e. the Monday before next Tuesday) revises this week's pages.
    const tueDate = addDays(BASE_TUESDAY, weekOffset*7);
    const satDate = addDays(tueDate, 4);
    const monDate = addDays(tueDate, 6); // Monday following, just before next Tuesday

    weekLabel.textContent = `${fmt(tueDate)} – ${fmt(addDays(tueDate,6))}`;
    weekNumEl.textContent = `Week ${weekOffset+1}`;

    const pages = pagesForWeek(weekOffset);
    const today = new Date();

    const rows = [
      {
        cls:'tue', date:tueDate, dayName:'Tuesday',
        session:'Word to Word Translation',
        page: pageText(pages),
        key:`tue-${weekOffset}`
      },
      {
        cls:'sat', date:satDate, dayName:'Saturday',
        session:'Tafsir',
        page: pageText(pages),
        key:`sat-${weekOffset}`
      },
      {
        cls:'mon', date:monDate, dayName:'Monday',
        session:'Revision — Word to Word',
        page: pageText(pages),
        key:`mon-${weekOffset}`
      }
    ];

    dayList.innerHTML = '';
    rows.forEach(r=>{
      const isToday = sameDate(r.date, today);
      const done = !!completed[r.key];
      const el = document.createElement('div');
      el.className = `day ${r.cls}${isToday ? ' today':''}`;
      el.innerHTML = `
        <div class="accent"></div>
        <div class="daybody">
          <div class="toprow">
            <span class="dayname">${r.dayName}${isToday ? '<span class="todaytag">TODAY</span>':''}</span>
            <span class="daydate">${fmt(r.date)} · 11:30</span>
          </div>
          <div class="session">${r.session}</div>
          <div class="pageline">${r.page}</div>
        </div>
        <div class="check ${done?'done':''}" data-key="${r.key}">
          <svg viewBox="0 0 24 24" fill="none" stroke="${getComputedStyle(document.documentElement).getPropertyValue('--bg')}" stroke-width="3"><path d="M4 12l5 5L20 7"/></svg>
        </div>
      `;
      dayList.appendChild(el);
    });

    dayList.querySelectorAll('.check').forEach(c=>{
      c.addEventListener('click', ()=>{
        const k = c.getAttribute('data-key');
        completed[k] = !completed[k];
        render();
        saveProgress();
      });
    });

    let pagesCompleted = 0;
    for(let w=0; w<=weekOffset; w++){
      const p = pagesForWeek(w);
      if(!p) break;
      if(completed[`tue-${w}`] && completed[`sat-${w}`]){
        pagesCompleted = p.endPage;
      } else {
        break;
      }
    }
    const pct = Math.min(100, (pagesCompleted/TOTAL_PAGES*100));
    progressVal.textContent = `Page ${pagesCompleted} of ${TOTAL_PAGES}`;
    barFill.style.width = pct.toFixed(2)+'%';
  }

  document.getElementById('prevWeek').addEventListener('click', ()=>{ weekOffset = Math.max(0, weekOffset-1); render(); });
  document.getElementById('nextWeek').addEventListener('click', ()=>{ weekOffset++; render(); });
  document.getElementById('todayBtn').addEventListener('click', ()=>{ weekOffset = currentWeekOffset(); render(); });

  loadProgress();
})();
</script>
</body>
</html>
